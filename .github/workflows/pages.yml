name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/frontend/package-lock.json
      - run: npm ci --prefix Frontend/frontend
      - run: npm test --prefix Frontend/frontend
      - run: npm run typecheck --prefix Frontend/frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@v5
      - name: Build public frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SITE_BASE_PATH: /LIVE-DEMO/
        run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
