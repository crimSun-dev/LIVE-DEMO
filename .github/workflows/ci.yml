name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-postgres-and-sqlite:
    name: Tests (SQLite + PostgreSQL, Ubuntu)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/dw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
      - name: CLI smoke test (Phase 1 deliverable)
        run: python -m app.cli recommend --rain --occasion campus
      - name: Secret check (no Neon credentials committed)
        working-directory: .
        run: |
          if git grep -nE "postgres(ql)?://[^:@/ ]+:[^@/ ]+@[^ ]*neon\.tech" -- . ':!*.md'; then
            echo "A Neon connection string with a password is committed. Rotate it." && exit 1
          fi

  test-windows:
    name: Tests (SQLite, Windows — the demo laptop OS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  measure:
    name: measure.py (offline, Ch 15 metrics)
    runs-on: ubuntu-latest
    needs: test-postgres-and-sqlite
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python measure.py --out-dir ../ci-results --report ../ci-results/RESULTS.md
      - run: cat ../ci-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-results
          path: ci-results/
