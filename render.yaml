# Optional FastAPI hosting; Neon remains the database provider.
services:
  - type: web
    name: digital-wardrobe-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: DEMO_API_KEY
        generateValue: true
      - key: WEATHER_MODE
        value: live
      - key: AUTO_SEED
        value: '1'
      - key: CORS_ORIGINS
        value: https://crimsun-dev.github.io
